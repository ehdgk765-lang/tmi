  <script>
    // 페이지 렌더 전 테마 적용 (깜빡임 방지)
    (function() {
      const saved = localStorage.getItem('theme');
      var deviceDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      // 사용자 선택 우선, 없으면 기기 설정 따름
      if (saved === 'dark' || (deviceDark && saved !== 'light')) {
        document.documentElement.classList.add('dark');
        // 크롬 강제 다크모드 방지: color-scheme 메타도 dark로 설정
        document.querySelector('meta[name="color-scheme"]').content = 'only dark';
      }
    })();
  </script>

  <!-- morphdom: DOM diffing for flicker-free updates -->
  <script src="https://unpkg.com/morphdom@2.7.4/dist/morphdom-umd.min.js"></script>
  <script>
    function patchDOM(container, html) {
      if (!container.firstElementChild) {
        container.innerHTML = html;
        return;
      }
      var tmp = document.createElement('div');
      tmp.innerHTML = html;
      morphdom(container, tmp, { childrenOnly: true });
    }
    // 무거운 라이브러리 동적 로딩 유틸 (xlsx ~300KB)
    // 페이지 로드 시에는 불필요 → 사용자 액션 시 최초 1회 로딩
    var _loadedScripts = {};
    function loadScript(url) {
      if (_loadedScripts[url]) return _loadedScripts[url];
      _loadedScripts[url] = new Promise(function(resolve, reject) {
        var s = document.createElement('script');
        s.src = url;
        s.onload = resolve;
        s.onerror = function() { _loadedScripts[url] = null; reject(new Error('Failed to load: ' + url)); };
        document.head.appendChild(s);
      });
      return _loadedScripts[url];
    }
    function loadXLSX() { return loadScript('https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js'); }
  </script>

  <!-- JS 모듈 (의존성 순서대로, 캐시 버스팅 적용) -->
  <script>
    [

      'js/roles-config.js',

      'js/results.js',
      'js/players.js',

      'js/league.js',
      'js/schedule.js',
      'js/custom-bracket.js',
      'js/calendar.js',

    ].forEach(function(src) {
      document.write('<script src="' + src + '?v=' + APP_VERSION + '"><\/script>');
    });

  <script>
    // 테마 토글 로직
    (function() {
      const toggle = document.getElementById('theme-toggle');
      const iconSun = document.getElementById('icon-sun');
      const iconMoon = document.getElementById('icon-moon');
      const metaColor = document.getElementById('meta-theme-color');

      function applyIcons(isDark) {
        iconSun.style.display = isDark ? 'none' : 'block';
        iconMoon.style.display = isDark ? 'block' : 'none';
        metaColor.content = isDark ? '#1e293b' : '#ffffff';
      }

      // 초기 아이콘 상태
      applyIcons(document.documentElement.classList.contains('dark'));

      toggle.addEventListener('click', function() {
        const isDark = document.documentElement.classList.toggle('dark');
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
        // color-scheme 메타 태그 업데이트 (크롬 강제 다크모드 방지)
        var csMeta = document.querySelector('meta[name="color-scheme"]');
        if (csMeta) csMeta.content = isDark ? 'only dark' : 'only light';
        applyIcons(isDark);
      });

    })();

    // 사이드 메뉴 열기/닫기
    (function() {
      var menuBtn = document.getElementById('menu-btn');
      var leftMenu = document.getElementById('left-menu');
      var overlay = document.getElementById('menu-overlay');
      var closeBtn = document.getElementById('menu-close');

      function openMenu() {
        leftMenu.classList.add('menu-open');
        overlay.classList.remove('hidden');
      }
      function closeMenu() {
        leftMenu.classList.remove('menu-open');
        overlay.classList.add('hidden');
      }

      menuBtn.addEventListener('click', openMenu);
      overlay.addEventListener('click', closeMenu);
      closeBtn.addEventListener('click', closeMenu);

      // 메뉴: 홈
      document.getElementById('menu-home').addEventListener('click', function() {
        closeMenu();
        App.showHome();
      });

      // 메뉴: 일정 보기
      document.getElementById('menu-calendar').addEventListener('click', function() {
        closeMenu();
        App.showCalendar();
      });

      // 메뉴: 회원 관리
      document.getElementById('menu-members').addEventListener('click', function() {
        closeMenu();
        App.showMembers();
      });

      // 메뉴: 설정
      document.getElementById('menu-settings').addEventListener('click', function() {
        closeMenu();
        App.showSettings();
      });

      // 메뉴 내 로그아웃
      document.getElementById('menu-logout').addEventListener('click', function() {
        closeMenu();
        Auth.logout();
      });
    })();

    // 헤더 로고 클릭 → 홈 이동
    document.getElementById('header-logo').addEventListener('click', function() {
      App.showHome();
      App.navigate(RolesConfig.getDefaultTab());
    });

    // 멤버 헤더 로그아웃 버튼
    document.getElementById('member-header-logout').addEventListener('click', function() {
      Auth.logout();
    });

    // 앱 시작 (Auth가 제어)
    document.addEventListener('DOMContentLoaded', function() {
      Auth.init();
    });

    // Service Worker 등록
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js').then(function(reg) {
        reg.addEventListener('updatefound', function() {
          var newSW = reg.installing;
          newSW.addEventListener('statechange', function() {
            if (newSW.state === 'activated' && navigator.serviceWorker.controller) {
              location.reload();
            }
          });
        });
      });
    }
  </script>
